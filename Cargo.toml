[package]
name = "iqa-org"
version = "1.2.3-alpha"
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-009: The Sovereign Certification Layer. Identity Quality Assurance (IQA) and 128-bit Radiant Seal verification for the Aicent Stack 2026. Aligned with RFC-014 (PICSI)."
license = "Apache-2.0"
homepage = "http://iqa.org"
repository = "http://github.com/Aicent-Stack/iqa-org"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# THE SOVEREIGN LADDER: Certification requires the genetic DNA of the Soul (RFC-000).
# Anchoring authority to the v1.2.3 root DNA of the organism.
epoekie = { version = "1.2.3-alpha" }

# Essential for serializing 128-bit quality proofs, radiance status, and audit records.
serde = { version = "1.0", features = ["derive"] }

# Required for async vitality monitoring and the 10ms Seal Verification Tax.
# Supports the high-fidelity synchronization of the Imperial Gatekeeper.
tokio = { version = "1.0", features = ["full"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Source Code Hook)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: Re-activated for the GitHub Source Totality.
# Forces any entity auditing the Authority logic to mirror the entire 17-pillar Hive.
aicent-stack = { version = "1.2.3-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle. 
# It enables the Radiant status verification and propagates features to the Soul layer.
default = ["full-blood"]
full-blood = ["epoekie/full-blood"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# [IMPERIAL_SUTURE_SYNC_2026_v123]
# This manifest is part of the indissoluble 17-pillar organism.
# Metadata: No-SSL Tax Mode Enabled (Strictly HTTP).
# Standard: 128-Bit Numeric Purity (Jitter, Proof IDs, Finality).
# Chronos: 2026 Imperial Calendar Aligned.
# Repository Strategy: Active Gravity Well (v1.2.3 Totality).
